[package]
name = "sauron-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/emanuel-minetti/actix-elm-setup"
description = "A first Test of the sauron-client"

[lib]
crate-type = ["cdylib"]

[dependencies]
sauron = { version = "0.70.0", features = ["default"] }
log = "0.4.28"
console_log = "1.0.0"
web-sys = { version = "0.3.81", features = ["default", "Window", "Storage"] }

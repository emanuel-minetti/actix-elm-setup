<!DOCTYPE html>
<html lang="en">
<head>
    <title>Elm Land</title>
    <meta name="elm-land" content="0.20.1">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/bootstrap-icons.css">
    <script src="/js/bootstrap.js"></script>
    <script src="/js/elm.js"></script>
</head>
<body>
<script src="/js/interop.js"></script>
<div id="elm"></div>
<script>
    let app = Elm.Main.init({
        node: document.getElementById('elm'),
        flags: {flags: flags({})}
    });
    if (app.ports) {
        if (app.ports.sendToLocalStorage) {
            app.ports.sendToLocalStorage.subscribe(({key, value}) => {
                window.localStorage[key] = value ;
            });
        }
        if (app.ports.sendToModal) {
            app.ports.sendToModal.subscribe(({id, value}) => {
                let modal = undefined
                if (value === true) {
                    modal = new bootstrap.Modal( '#' + id, {backdrop: 'static'});
                    modal.show();
                }
                else
                    if (typeof modal !== 'undefined') {
                        // noinspection JSObjectNullOrUndefined
                        modal.dispose();
                    }
            });
        }
    }
</script>

</body>
</html>
